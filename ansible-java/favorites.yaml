- name: Install Terraform and Ansible
  hosts: all
  vars:
    ansible_connection: aws_ssm
    ansible_aws_ssm_bucket_name: otherdevopsgene-ansible-ssm
    ansible_aws_ssm_region: us-east-2
  become: yes

  roles:
    - role: andrewrothstein.terraform
    - role: geerlingguy.ansible
    - role: geerlingguy.java
      java_packages:
        - java-25-amazon-corretto

    - role: gantsign.maven

  tasks:    
  - name: Install Checkov
    ansible.builtin.pip:
      name: checkov
    become_user: ec2-user

  - name: Install Grype
    ansible.builtin.unarchive:
      src: https://github.com/anchore/grype/releases/download/v0.110.0/grype_0.110.0_linux_amd64.tar.gz
      dest: /usr/local/bin
      remote_src: yes
      include: [grype]
      owner: root
      group: root
      mode: '0755'

  - name: Install Trivy
    ansible.builtin.unarchive:
      src: https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
      dest: /usr/local/bin
      remote_src: yes
      include: [trivy]
      owner: root
      group: root
      mode: '0755'

  - name: Download k3s installation script
    ansible.builtin.get_url:
      url: https://get.k3s.io
      dest: /tmp/k3s-install.sh
      owner: ec2-user
      group: ec2-user
      mode: '0755'
  
  - name: Install k3s service
    ansible.builtin.command: 
      cmd: /tmp/k3s-install.sh --write-kubeconfig-mode "0644"
      creates: /etc/rancher/k3s/k3s.yaml
  
  - name: Create .kube directory
    ansible.builtin.file:
      path: /home/ec2-user/.kube
      state: directory
      owner: ec2-user
      group: ec2-user
      mode: '0750'

  - name: Copy kubeconfig into standard location
    ansible.builtin.copy: 
      src: /etc/rancher/k3s/k3s.yaml 
      dest: /home/ec2-user/.kube/config
      remote_src: yes
      owner: ec2-user
      group: ec2-user
      mode: '0600'

  - name: Download helm installation script
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
      dest: /tmp/get_helm.sh
      owner: ec2-user
      group: ec2-user
      mode: '0755'

  - name: Install helm
    ansible.builtin.command: 
      cmd: /tmp/get_helm.sh
      creates: /usr/local/bin/helm

  - name: Install kubectl code completion
    ansible.builtin.shell:
      cmd: kubectl completion bash > /etc/profile.d/kubectl_completion.sh
      creates: /etc/profile.d/kubectl_completion.sh
